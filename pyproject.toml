[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-metrics"
version = "0.1.0"
description = "New listing performance metrics for CoinDCX spot (and later futures)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sheets = [
  "gspread>=6.0",
  "google-auth>=2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
listing-metrics = "listing_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
